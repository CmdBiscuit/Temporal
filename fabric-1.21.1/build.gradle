plugins {
    id 'fabric-loom' version '1.19.3'
    id 'idea'
}

version = mod_version
group = mod_group_id
// The loader and Minecraft version in the file name keep it apart from the NeoForge 1.21.1 jar.
base.archivesName = 'temporal-fabric-1.21.1'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    // Mod Menu (its config-screen hook; optional at runtime)
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    mixin {
        defaultRefmapName = 'temporal.refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's names, the same ones the NeoForge build is written against.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // Vulkan bindings for the DLSS bridge. Must match Minecraft's LWJGL (3.3.3 for 1.21.1); pure Java on Windows.
    include(implementation('org.lwjgl:lwjgl-vulkan:3.3.3'))
}

// Optional local test setup.
if (file('autotest.gradle').exists()) {
    apply from: 'autotest.gradle'
}

// NVIDIA Streamline runtime (DLSS). Unpack the SDK into third_party/streamline; only these DLLs ship in the jar.
def streamlineBin = file('third_party/streamline/bin/x64')
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    from(streamlineBin) {
        include 'sl.interposer.dll', 'sl.common.dll', 'sl.dlss.dll', 'nvngx_dlss.dll', 'nvngx_dlss.license.txt'
        // DLSS Frame Generation and the Reflex/PCL plugins it requires
        include 'sl.dlss_g.dll', 'nvngx_dlssg.dll', 'sl.reflex.dll', 'sl.pcl.dll', 'NvLowLatencyVk.dll', 'reflex.license.txt'
        into 'natives/streamline'
    }
    from('third_party/streamline') {
        include 'license.txt'
        rename { 'LICENSE-Streamline.txt' }
    }
    // AMD FidelityFX SDK 1.1.4 (FSR 3.1, the last release with a Vulkan backend).
    from('third_party/fidelityfx/PrebuiltSignedDLL') {
        include 'amd_fidelityfx_vk.dll'
        into 'natives/fidelityfx'
    }
    from('third_party/fidelityfx') {
        include 'LICENSE.txt'
        rename { 'LICENSE-FidelityFX.txt' }
    }
    // Temporal's own license (MIT), with notes on the third-party parts above.
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
